    <!-- Fuente QE Rufus incrustada (base64): funciona sin internet y sin depender del archivo .ttf -->
    <style id="qerufus-font">
        @font-face {
            font-family: 'QE Rufus';
            src: url(data:font/ttf;base64,/*QERUFUS_BASE64*/) format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
    </style>
    <style>
        /* Impresión directa (Ctrl+P): solo las hojas, tamaño A4 exacto */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {

            html,
            body {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
            }

            aside,
            #canvas-hint,
            #edit-overlay,
            #main-scroll>div:not(#pages-wrapper) {
                display: none !important;
            }

            #main-scroll {
                overflow: visible !important;
                padding: 0 !important;
                background: #fff !important;
            }

            #pages-wrapper {
                display: block !important;
                padding: 0 !important;
            }

            .page-container {
                display: block;
                width: 210mm !important;
                height: 297mm !important;
                max-width: none !important;
                margin: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                transform: none !important;
                break-after: page;
                page-break-after: always;
            }

            .page-container:last-child {
                break-after: auto;
                page-break-after: auto;
            }
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        .page-container {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.05);
            background: white;
            cursor: crosshair;
            transition: transform 0.2s ease;
        }



        .toolbar-btn {
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            color: #4f46e5;
            background: #e0e7ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .toolbar-btn:hover {
            background: #c7d2fe;
            border-color: #a5b4fc;
        }

        /* Editor flotante para edición WYSIWYG */
        #edit-overlay {
            position: fixed;
            display: none;
            z-index: 100;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #6366f1;
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.25), 0 2px 8px rgba(0, 0, 0, 0.15);
            min-width: 240px;
            max-width: 420px;
        }

        #edit-overlay label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: #6366f1;

    <script>
        // =========================================================
        //  MODO GLOBAL
        // =========================================================
        let currentMode = 'latex'; // 'latex' | 'markdown' | 'mixed'

        function setMode(mode) {
            currentMode = mode;
            ['latex', 'markdown', 'mixed'].forEach(m => {
                document.getElementById('mode-' + m).classList.toggle('active', m === mode);
                const tb = document.getElementById('toolbar-' + m);
                if (tb) tb.style.setProperty('display', m === mode ? 'flex' : 'none', 'important');
            });
            triggerRender();
        }

        // =========================================================
        //  UTILIDADES DE BARRA DE HERRAMIENTAS
        // =========================================================
        function wrapText(pre, post) {
            const input = document.getElementById('text-input');
            const start = input.selectionStart, end = input.selectionEnd;
            const text = input.value, selected = text.substring(start, end);
            input.value = text.substring(0, start) + pre + selected + post + text.substring(end);
            input.focus();
            input.setSelectionRange(start + pre.length, start + pre.length + selected.length);
            input.dispatchEvent(new Event('input'));
        }

        function insertLine(prefix) {
            const input = document.getElementById('text-input');
            const start = input.selectionStart;
            const text = input.value;
            // Ir al inicio de la línea actual
            let lineStart = text.lastIndexOf('\n', start - 1) + 1;
            input.value = text.substring(0, lineStart) + prefix + text.substring(lineStart);
            input.focus();
            input.setSelectionRange(lineStart + prefix.length, lineStart + prefix.length);
            input.dispatchEvent(new Event('input'));
        }

        // Reemplaza todos los \textbf{contenido} por \text{contenido} en el editor
        function stripBoldToText() {
            const input = document.getElementById('text-input');
            const before = input.value;
            // Reemplaza \textbf{...} → \text{...} (respeta llaves anidadas con un loop)
            let after = before.replace(/\\textbf\{([^}]*)\}/g, '\\text{$1}');
            if (after === before) {
                // Nada que reemplazar
                input.focus();
                return;
            }
            const cursor = input.selectionStart;
            input.value = after;
            // Mantener cursor en posición aproximada
            input.setSelectionRange(Math.min(cursor, after.length), Math.min(cursor, after.length));
            input.focus();
            input.dispatchEvent(new Event('input'));
        }

        document.addEventListener('DOMContentLoaded', () => {
            // ===== DOM =====
            const $ = id => document.getElementById(id);
            const textInput = $('text-input'), fontSelect = $('font-select');
            const paperSelect = $('paper-select'), colorSelect = $('color-select');
            const headerText = $('header-text'), pageNumbers = $('page-numbers');
            const sizeRange = $('size-range'), sizeVal = $('size-val');
            const widthRange = $('width-range'), widthVal = $('width-val');
            const tiltRange = $('tilt-range'), tiltVal = $('tilt-val');
            const jitterRange = $('jitter-range'), jitterVal = $('jitter-val');
            const wobbleRange = $('wobble-range'), wobbleVal = $('wobble-val');
            const indentRange = $('indent-range'), indentVal = $('indent-val');
            const fallbackWeightRange = $('fallback-weight-range'), fallbackWeightVal = $('fallback-weight-val');
            const mainWeightRange = $('main-weight-range'), mainWeightVal = $('main-weight-val');
            const stripAccentsChk = $('strip-accents');
            const pencilEffectChk = $('pencil-effect');
            const humanizeToggle = $('humanize-toggle');
            const inkPhysicsToggle = $('ink-physics-toggle');
            const strikeoutToggle = $('strikeout-toggle');

            const nativeRandom = Math.random.bind(Math);

            // =========================================================

                    } else {

            // Composiciones: c = carácter, s = escala, dx/dy = desplazamiento (en em)
            const GREEK_COMPOSITES = {
                '\uE000': [{ c: '0' }, { c: '–', s: 0.8, dy: -0.12 }],              // θ
                '\uE001': [{ c: 'O' }, { c: '–', s: 0.9, dy: -0.16 }],              // Θ
                '\uE002': [{ c: 'o' }, { c: '|', s: 1.05, dy: 0.12 }],              // φ
                '\uE003': [{ c: 'O' }, { c: '|', s: 1.1, dy: 0.08 }],               // Φ
                '\uE004': [{ c: 'u' }, { c: '|', s: 1.05, dy: 0.12 }],              // ψ
                '\uE005': [{ c: 'U' }, { c: '|', s: 1.1, dy: 0.08 }],               // Ψ
                '\uE006': [{ c: 'o' }, { c: '–', s: 0.55, dx: 0.2, dy: -0.2 }],     // σ
                '\uE007': [{ c: '\\' }, { c: '/', s: 0.55, dx: -0.14 }],            // λ
                '\uE008': [{ c: '|', s: 0.85, adv: 3, dx: -0.1 }, { c: '–', s: 0.6, dx: 0.06, dy: -0.4 }], // Γ
                '\uE009': [{ c: '/', s: 0.85, adv: 1.5, dx: -0.11 }, { c: '\\', s: 0.85, dx: 0.11 }],        // Λ
                '\uE00A': [{ c: '–', s: 0.8, dy: -0.42 }, { c: '–', s: 0.6, dy: -0.2 }, { c: '–', s: 0.8, dy: 0.06 }], // Ξ

            // ¿La fuente trae este glifo? (se compara contra dos fuentes de reserva distintas)

            function adaptGreek(str) {

            const SYM = {
